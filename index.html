<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow A Garden 2 - Live Monitoring</title>
    <style>
        body {
            background-color: #0f121e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b2e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2d3748;
        }
        h2 { color: #4ade80; margin-top: 0; }
        .stats {
            background: #1e2640;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .card {
            background: #1e2640;
            border: 1px solid #2d3748;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-weight: bold; font-size: 14px; color: #e2e8f0; }
        .item-count { background: #143324; color: #4ade80; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌱 Grow A Garden 2 - Live Dashboard</h2>
    <div class="stats">
        <div>
            <span id="player-name" style="font-weight: bold; color: #60a5fa;">Memuat Player...</span><br>
            <small style="color: #94a3b8;" id="last-update">Status: Menghubungkan...</small>
        </div>
        <div style="color: #4ade80; font-weight: bold;" id="total-types">0 Jenis Item</div>
    </div>

    <div class="grid" id="item-grid">
        <!-- Item akan dimuat otomatis di sini -->
    </div>
</div>

<script>
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA_DISINI";
    const API_KEY = "MASUKKAN_MASTER_KEY_ANDA_DISINI"; // Opsional jika bin diset public

    async function fetchData() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    ["X-Master-Key"]: API_KEY
                }
            });
            const result = await response.json();
            const data = result.record;

            // Update informasi player & waktu
            document.getElementById("player-name").innerText = "Player: " + data.player;
            document.getElementById("last-update").innerText = "Terakhir Diperbarui: " + new Date().toLocaleTimeString();

            const grid = document.getElementById("item-grid");
            grid.innerHTML = "";

            let count = 0;
            for [itemName, qty] of Object.entries(data.items)) {
                count++;
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <span class="item-name">🌿 ${itemName}</span>
                    <span class="item-count">x${qty}</span>
                `;
                grid.appendChild(card);
            }
            document.getElementById("total-types").innerText = count + " Jenis Item";

        } catch (error) {
            console.error("Gagal memuat data:", error);
            document.getElementById("last-update").innerText = "Status: Gagal mengambil data web.";
        }
    }

    // Refresh data web secara otomatis setiap 5 detik
    setInterval(fetchData, 5000);
    fetchData();
</script>

</body>
</html>
