<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Account Cloud Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f121e;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #4ade80;
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b2e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-left: 5px solid #38bdf8;
        }
        .card h3 {
            margin-top: 0;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .info-item {
            background: #1e253c;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-stop {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-stop:hover {
            background-color: #dc2626;
        }
        .item-list {
            font-size: 13px;
            color: #94a3b8;
            background: #111526;
            padding: 10px;
            border-radius: 6px;
        }
        .no-data {
            text-align: center;
            color: #64748b;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌱 Multi-Account Live Dashboard</h2>
        <div id="accounts-container">
            <div class="no-data">Memuat data dari cloud...</div>
        </div>
    </div>

    <script>
        const BIN_ID = "6a6b4a70f5f4af5e29d5a623";
        const API_KEY = "$2a$10$SQCp/OkqnUEFvNA1EYKrwuRqqrZIxzO7G1tJuDos7XgY1l1cySG4y";
        const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        async function fetchDashboardData() {
            try {
                let response = await fetch(URL, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let result = await response.json();
                let accounts = result.record.accounts || {};
                
                let container = document.getElementById("accounts-container");
                let html = "";

                if (Object.keys(accounts).length === 0) {
                    container.innerHTML = `<div class="no-data">Tidak ada akun Roblox yang terhubung saat ini.</div>`;
                    return;
                }

                for (let [accountName, data] of Object.entries(accounts)) {
                    let lastUpdate = new Date(data.LastUpdate * 1000).toLocaleTimeString();
                    
                    // Format daftar item inventory
                    let itemsHtml = "";
                    if (data.items && Object.keys(data.items).length > 0) {
                        for (let [itemName, itemDetails] of Object.entries(data.items)) {
                            itemsHtml += `${itemName} (${itemDetails.count}), `;
                        }
                        itemsHtml = itemsHtml.slice(0, -2); // Hapus koma terakhir
                    } else {
                        itemsHtml = "Inventory Kosong";
                    }

                    html += `
                        <div class="card">
                            <h3>
                                <span>👤 ${accountName}</span>
                                <button class="btn-stop" onclick="sendCommand('${accountName}', 'stop')">Matikan Akun</button>
                            </h3>
                            <div class="info-grid">
                                <div class="info-item">💰 <b>Shekles:</b> ${data.shekles || 0}</div>
                                <div class="info-item">📱 <b>Device/Pkg:</b> ${data.package || '-'}</div>
                                <div class="info-item">⚡ <b>FPS / Ping:</b> ${data.metrics?.fps || 60} / ${data.metrics?.ping || 0}ms</div>
                                <div class="info-item">🕒 <b>Update:</b> ${lastUpdate}</div>
                            </div>
                            <div class="item-list">
                                <b>🎒 Inventory:</b> ${itemsHtml}
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (error) {
                console.error("Gagal mengambil data:", error);
            }
        }

        async function sendCommand(accountKey, command) {
            try {
                let getResp = await fetch(URL, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let getResult = await getResp.json();
                let currentAccounts = getResult.record.accounts || {};
                let currentCommands = getResult.record.commands || {};

                currentCommands[accountKey] = command;

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({
                        accounts: currentAccounts,
                        commands: currentCommands
                    })
                });
                
                alert(`Perintah '${command}' dikirim ke ${accountKey}`);
                fetchDashboardData();
            } catch (err) {
                alert("Gagal mengirim perintah!");
            }
        }

        // Refresh data otomatis setiap 4 detik
        setInterval(fetchDashboardData, 4000);
        fetchDashboardData();
    </script>
</body>
</html>
