<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Control Center - Dashboard Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f121e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #161b2e;
            padding: 20px;
            border-radius: 10px;
        }
        h2 {
            color: #4ade80;
        }
        .card {
            background-color: #1f293d;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background-color: #0f121e;
            color: white;
            border: 1px solid #374151;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌱 Grow A Garden 2 - Web Control Center</h2>
        
        <div class="card">
            <h3>Pilih Akun yang Dipantau</h3>
            <select id="accountSelect">
                <option value="">-- Pilih Akun --</option>
                <option value="pacew13">pacew13</option>
            </select>
        </div>

        <div class="card">
            <h3>Informasi Akun</h3>
            <p><strong>Shekles:</strong> <span id="sheklesDisplay">0</span></p>
        </div>

        <div class="card">
            <h3>Barang Terkumpul (Inventory)</h3>
            <div id="inventoryList">
                <p style="color: #9ca3af;">Belum ada item yang termuat...</p>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi JSONBin Anda
        const BIN_ID = "6a6b4a70f5f4af5e29d5a623";
        const API_KEY = "$2a$10$SQCp/OkqnUEfVA1EYKrwuRqgrZIXz07G1tdoF2aUqj.a9134zV8K.";
        const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

        async function fetchData() {
            try {
                let response = await fetch(URL, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let data = await response.json();
                let accounts = data.record.accounts || {};

                let selectedAccount = document.getElementById("accountSelect").value;
                if (selectedAccount && accounts[selectedAccount]) {
                    let accData = accounts[selectedAccount];
                    
                    // Update Shekles
                    document.getElementById("sheklesDisplay").innerText = accData.Shekles || 0;

                    // Update Inventory
                    let inventoryContainer = document.getElementById("inventoryList");
                    inventoryContainer.innerHTML = "";

                    let inventory = accData.Inventory || {};
                    if (Object.keys(inventory).length === 0) {
                        inventoryContainer.innerHTML = '<p style="color: #9ca3af;">Inventory kosong.</p>';
                    } else {
                        for (const [itemName, count] of Object.entries(inventory)) {
                            let itemDiv = document.createElement("div");
                            itemDiv.style.padding = "5px 0";
                            itemDiv.style.borderBottom = "1px solid #374151";
                            itemDiv.innerText = `${itemName} : x${count}`;
                            inventoryContainer.appendChild(itemDiv);
                        }
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil data dari Cloud:", error);
            }
        }

        // Jalankan pembaruan otomatis setiap 5 detik
        setInterval(fetchData, 5000);
        document.getElementById("accountSelect").addEventListener("change", fetchData);
    </script>

</body>
</html>
