
<script>
    const BIN_ID = "6a6a3b9ff5f4af5e29d235de";
    const API_KEY = "$2a$10$ap1SNJRB2ssxoZgyZpzZHecTkYxsSNtk7ipBxo6WjTCGYtjsUugyC";

    let globalData = { player: "", shekles: 0, items: {}, targets: [], devices: [], metrics: {}, remoteScript: "", scriptTimestamp: 0, lastHeartbeat: 0 };

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'dashboard') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-dashboard').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-scripts').classList.add('active');
        }
    }

    async function fetchData() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            if (!response.ok) return; // Mencegah error crash jika limit tercapai sesaat
            
            const result = await response.json();
            globalData = result.record;

            const badge = document.getElementById("session-badge");
            
            const now = Date.now();
            const lastActiveTime = globalData.lastHeartbeat || 0;
            const isOnline = globalData.player && globalData.player !== "" && (now - lastActiveTime < 60000);

            if (!isOnline) {
                badge.className = "offline-badge";
                badge.innerText = "○ Offline";
                
                globalData.items = {};
                globalData.shekles = 0;
                globalData.player = "Offline";
                globalData.metrics = { fps: 0, ping: 0 };

                document.getElementById("online-count").innerText = "0/1 Online";
                document.getElementById("player-name").innerText = "Player Utama: Offline / Tidak Terhubung";
                document.getElementById("last-update").innerText = "Status: Terputus";
                document.getElementById("metric-fps").innerText = "0 FPS";
                document.getElementById("metric-ping").innerText = "0 ms";
                document.getElementById("total-types").innerText = "0 Jenis Item";
                
                document.getElementById("item-grid").innerHTML = "";
                document.getElementById("device-table-body").innerHTML = `
                    <tr>
                        <td>
                            <div style="display: flex; flex-direction: column;">
                                <span class="account-name">🔴 Offline</span>
                                <span style="font-size: 9px; color: #94a3b8;">Tidak ada sesi aktif</span>
                            </div>
                        </td>
                        <td class="shekles-val">0</td>
                    </tr>
                `;
                return;
            }

            badge.className = "online-badge";
            badge.innerText = "● Online";

            document.getElementById("online-count").innerText = "1/1 Online";
            document.getElementById("player-name").innerText = "Player Utama: " + (globalData.player || "Unknown");
            document.getElementById("last-update").innerText = "Update: " + new Date().toLocaleTimeString();

            if (globalData.metrics) {
                document.getElementById("metric-fps").innerText = (globalData.metrics.fps || 60) + " FPS";
                document.getElementById("metric-ping").innerText = (globalData.metrics.ping || 50) + " ms";
            }

            renderTargets();
            renderDevices(true);
            renderInventoryGrid();

        } catch (error) {
            console.error("Gagal memuat data:", error);
        }
    }

    function renderInventoryGrid() {
        const grid = document.getElementById("item-grid");
        grid.innerHTML = "";

        const searchQuery = (document.getElementById("item-search-input").value || "").toLowerCase();
        let count = 0;
        let visibleCount = 0;

        for (const [itemName, itemData] of Object.entries(globalData.items || {})) {
            count++;
            if (searchQuery && !itemName.toLowerCase().includes(searchQuery)) {
                continue;
            }
            visibleCount++;

            let qty = 1;
            let rawIcon = "";

            if (typeof itemData === 'object' && itemData !== null) {
                qty = itemData.count || 1;
                rawIcon = itemData.icon || "";
            } else {
                qty = itemData;
            }

            let iconHtml = '<span style="font-size: 14px;">🌱</span>';
            if (rawIcon) {
                let assetId = rawIcon.replace(/[^0-9]/g, '');
                if (assetId) {
                    let imageUrl = `https://www.roblox.com/asset-thumbnail/image?assetId=${assetId}&width=150&height=150&format=png`;
                    iconHtml = `<img src="${imageUrl}" onerror="this.parentElement.innerHTML='<span style=\\'font-size: 14px;\\'>🌱</span>'">`;
                }
            }

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="item-icon-box">${iconHtml}</div>
                <div class="item-info">
                    <span class="item-name" title="${itemName}">${itemName}</span>
                    <span class="item-sub">Inventory</span>
                </div>
                <span class="item-count">x${qty}</span>
            `;
            grid.appendChild(card);
        }
        document.getElementById("total-types").innerText = visibleCount + " / " + count + " Jenis Item";
    }

    async function updateCloudData() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { 
                    "Content-Type": "application/json", 
                    "X-Master-Key": API_KEY 
                },
                body: JSON.stringify(globalData)
            });
        } catch (error) {
            console.error("Gagal memperbarui data:", error);
        }
    }

    async function sendScriptToGame() {
        const scriptText = document.getElementById("script-input").value.trim();
        if (!scriptText) return;

        globalData.remoteScript = scriptText;
        globalData.scriptTimestamp = Date.now();
        
        document.getElementById("execution-log").innerText = "Status: Mengirim script ke cloud...";
        await updateCloudData();
        document.getElementById("execution-log").innerText = "Status: Script berhasil dikirim dan siap dieksekusi!";
    }

    function renderTargets() {
        let listContainer = document.getElementById("target-list");
        listContainer.innerHTML = "";
        if (!globalData.targets) globalData.targets = [];

        globalData.targets.forEach((username, index) => {
            const item = document.createElement("div");
            item.className = "target-item";
            item.innerHTML = `
                <span>👤 ${username}</span>
                <button class="delete-btn" onclick="removeUsername(${index})">HAPUS</button>
            `;
            listContainer.appendChild(item);
        });
    }

    function renderDevices(isOnline) {
        const tbody = document.getElementById("device-table-body");
        tbody.innerHTML = "";
        
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>
                <div style="display: flex; flex-direction: column;">
                    <span class="account-name">${isOnline ? '🟢' : '🔴'} ${globalData.player || "Unknown"}</span>
                    <span style="font-size: 9px; color: #94a3b8;">${isOnline ? 'Dalam Game' : 'Offline'}</span>
                </div>
            </td>
            <td class="shekles-val">${(globalData.shekles || 0).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    }

    async function addUsername() {
        const input = document.getElementById("username-input");
        const val = input.value.trim();
        if (val) {
            if (!globalData.targets) globalData.targets = [];
            if (!globalData.targets.includes(val)) {
                globalData.targets.push(val);
                input.value = "";
                renderTargets();
                await updateCloudData();
            }
        }
    }

    async function removeUsername(index) {
        if (globalData.targets) {
            globalData.targets.splice(index, 1);
            renderTargets();
            await updateCloudData();
        }
    }

    document.getElementById("username-input").addEventListener("keypress", function(e) {
        if (e.key === 'Enter') addUsername();
    });

    // Web melakukan pengecekan setiap 10 detik sekali agar aman dari Error 429
    setInterval(fetchData, 10000);
    fetchData();
</script>
