<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Live Remote Control Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #4ade80;
            text-align: center;
        }
        .card {
            background: #27272a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status-online {
            color: #4ade80;
            font-weight: bold;
        }
        .status-offline {
            color: #f87171;
            font-weight: bold;
        }
        .metrics-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .item-card {
            display: flex;
            justify-content: space-between;
            background: #3f3f46;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;
        }
        #inventory-list {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control Center</h2>
    
    <!-- Status Sesi -->
    <div class="card">
        <div id="player-name">Memuat Player...</div>
        <div>Status: <span id="status-badge" class="status-offline">Menghubungkan...</span></div>
        <div class="metrics-row">
            <span>Performa FPS: <strong id="fps-val">0 FPS</strong></span>
            <span>Koneksi Ping: <strong id="ping-val">0 ms</strong></span>
        </div>
        <div style="margin-top: 8px;">Shekles: <strong id="player-shekles">0</strong></div>
    </div>

    <!-- Barang Terkumpul -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <span>Barang Terkumpul (Inventory)</span>
            <span id="total-types">0 Jenis Item</span>
        </div>
        <div id="inventory-list">
            <div style="color: #a1a1aa; text-align: center; padding: 10px;">Menunggu data dari game...</div>
        </div>
    </div>
</div>

<script>
    const BIN_ID = "6a6aba72da38895dfea25258";
    const API_KEY = "$2a$10$ERw5fC9bbSp9uFZOfMSSBe/JMRlA6u0xMsbEaI3qmBmP3noMd8LkW";
    const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

    function updateDashboardUI(record) {
        // Cek status Online/Offline berdasarkan waktu update terakhir (< 10 detik)
        const currentTime = Math.floor(Date.now() / 1000);
        const lastHeartbeat = record.lastHeartbeat ? Math.floor(record.lastHeartbeat / 1000) : record.timestamp;
        const isOnline = (currentTime - lastHeartbeat) < 10;

        const statusBadge = document.getElementById("status-badge");
        statusBadge.innerText = isOnline ? "Online" : "Offline";
        statusBadge.className = isOnline ? "status-online" : "status-offline";

        // Update teks informasi player & metrics
        document.getElementById("player-name").innerText = record.player || "Player Aktif";
        document.getElementById("player-shekles").innerText = record.shekles ? record.shekles.toLocaleString() : "0";
        document.getElementById("fps-val").innerText = (record.metrics && record.metrics.fps) ? record.metrics.fps + " FPS" : "0 FPS";
        document.getElementById("ping-val").innerText = (record.metrics && record.metrics.ping) ? record.metrics.ping + " ms" : "0 ms";

        // Update daftar inventory secara dinamis
        const inventoryContainer = document.getElementById("inventory-list");
        if (record.items) {
            inventoryContainer.innerHTML = "";
            let totalTypesCount = 0;

            for (let [itemName, itemData] of Object.entries(record.items)) {
                totalTypesCount++;
                let itemCard = document.createElement("div");
                itemCard.className = "item-card";
                itemCard.innerHTML = `
                    <span>${itemName}</span>
                    <span style="color: #4ade80; font-weight: bold;">x${itemData.count.toLocaleString()}</span>
                `;
                inventoryContainer.appendChild(itemCard);
            }
            document.getElementById("total-types").innerText = `${totalTypesCount} Jenis Item`;
        }
    }

    async function fetchInventoryData() {
        try {
            let response = await fetch(URL, {
                headers: { "X-Master-Key": API_KEY }
            });
            
            if (!response.ok) throw new Error("Gagal mengambil data dari server");
            
            let data = await response.json();
            if (data && data.record) {
                updateDashboardUI(data.record);
            }
        } catch (error) {
            console.error("Koneksi error:", error);
            document.getElementById("status-badge").innerText = "Offline (Gagal Terhubung)";
            document.getElementById("status-badge").className = "status-offline";
        }
    }

    // Panggil pertama kali saat halaman dibuka
    fetchInventoryData();

    // Pasang setInterval agar halaman web otomatis merefresh data setiap 2 detik
    setInterval(fetchInventoryData, 2000);
</script>

</body>
</html>
