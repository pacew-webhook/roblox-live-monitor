<!-- Bagian Tampilan Tombol di Web -->
<div style="background: #161b2e; padding: 15px; border-radius: 10px; width: 250px; font-family: sans-serif;">
    <h3 style="color: #4ade80; margin-top: 0; font-size: 14px;">🎮 Device Control Panel</h3>
    <button id="openRobloxBtn" onclick="sendOpenCommand()" style="background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">Buka Roblox (pacew9)</button>
    <p id="statusLog" style="color: #38bdf8; font-size: 11px; margin-top: 8px; margin-bottom: 0;">Status: Siap</p>
</div>

<!-- Bagian Skrip JavaScript untuk Mengirim Perintah -->
<script>
const BIN_ID = "6a6aba72da38895dfea25258";
const API_KEY = "$2a$10$ERw5fC9bbSp9uFZOfMSSBe/JMRlA6u0xMsbEaI3qmBmP3noMd8LkW";
const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

async function sendOpenCommand() {
    const logEl = document.getElementById("statusLog");
    logEl.innerText = "Mengirim perintah ke perangkat...";

    try {
        // 1. Ambil data database terbaru agar data akun lain tidak tertimpa/hilang
        let getRes = await fetch(URL, {
            method: "GET",
            headers: { "X-Master-Key": API_KEY }
        });
        
        let getData = await getRes.json();
        let record = getData.record || {};
        
        // Pastikan struktur objek commands tersedia
        if (!record.commands) {
            record.commands = {};
        }

        // 2. Berikan perintah OPEN khusus untuk target akun "pacew9"
        record.commands["pacew9"] = "OPEN";

        // 3. Simpan kembali perubahan perintah tersebut ke JSONBin
        let putRes = await fetch(URL, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
            },
            body: JSON.stringify(record)
        });

        if (putRes.ok) {
            logEl.innerText = "Perintah OPEN terkirim! Menunggu Daemon HP...";
        } else {
            logEl.innerText = "Gagal mengirim perintah ke server.";
        }
    } catch (error) {
        console.error(error);
        logEl.innerText = "Terjadi kesalahan jaringan.";
    }
}
</script>
